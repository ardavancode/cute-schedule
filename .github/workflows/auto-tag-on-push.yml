name: Auto Tag Demo Branch

on:
  push:
    branches:
      - demo

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch tags
        run: git fetch --tags

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine next tag
        id: get
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.2.6.0)
          echo "آخرین تگ فعلی: $LAST"

          BASE=${LAST#v}
          IFS='.' read -r MA MI PA BL <<<"$BASE"

          # اگه عدد چهارمی (BL) وجود نداشت، درستش کن
          if [ -z "$BL" ]; then BL=0; fi

          # همیشه فرمت 4 عددی نگه دار
          NEXT="v${MA}.${MI}.${PA}.$((BL+1))"

          echo "تگ جدید: $NEXT"
          echo "next_tag=$NEXT" >> $GITHUB_OUTPUT

      - name: Create & Push Tag (Safe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get.outputs.next_tag }}"
          # حذف نسخه‌ی قبلی اگر موجود بود
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag -a "$TAG" -m "Auto build $TAG"
          git push origin "$TAG"
          echo "✅ تگ جدید ساخته شد و پوش شد: $TAG"
