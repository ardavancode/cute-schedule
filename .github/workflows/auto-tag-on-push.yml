name: Auto Tag Demo Branch

on:
  push:
    branches:
      - demo  # فقط وقتی روی demo پوش بشه

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch tags
        run: git fetch --tags

      - name: Get next tag
        id: get
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.2.6.0)
          BASE=${LAST#v}
          IFS='.' read -r MA MI PA BL <<<"$BASE"
          [ -z "$BL" ] && BL=0
          BL=$((BL+1))
          NEXT="v${MA}.${MI}.${PA}.${BL}"
          echo "next_tag=$NEXT" >> $GITHUB_OUTPUT
          echo "Next tag: $NEXT"

      - name: Create & push tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -a "${{ steps.get.outputs.next_tag }}" -m "Auto build ${{ steps.get.outputs.next_tag }}"
          git push origin "${{ steps.get.outputs.next_tag }}"
