name: Auto Tag Demo Branch

on:
  push:
    branches:
      - demo  # هر بار که چیزی روی demo پوش بشه، اجرا میشه

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch tags
        run: git fetch --tags

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Get next tag
        id: get
        run: |
          # آخرین تگ فعلی رو پیدا کن (اگه نبود از v0.2.6.0 شروع کن)
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.2.6.0)
          echo "آخرین تگ فعلی: $LAST"

          # حذف v از اول تگ
          BASE=${LAST#v}

          # جدا کردن اعداد نسخه
          IFS='.' read -r MA MI PA BL <<<"$BASE"

          # اگه عدد چهارمی وجود نداره، بسازش
          [ -z "$BL" ] && BL=0

          # افزایش عدد آخر
          BL=$((BL+1))

          # ساخت نسخه‌ی جدید
          NEXT="v${MA}.${MI}.${PA}.${BL}"

          echo "تگ جدید: $NEXT"
          echo "next_tag=$NEXT" >> $GITHUB_OUTPUT

      - name: Create & Push Tag (Safe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get.outputs.next_tag }}"

          # اگه تگ از قبل وجود داشت، حذفش کن (لوکال و ریموت)
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # ساخت تگ جدید
          git tag -a "$TAG" -m "Auto build $TAG"

          # پوش تگ جدید به گیت‌هاب
          git push origin "$TAG"

          echo "✅ تگ جدید ساخته و پوش شد: $TAG"
